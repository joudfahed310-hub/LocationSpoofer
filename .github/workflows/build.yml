name: Build iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Clean Environment
        shell: bash
        run: |
          set -e
          echo "Cleaning old builds..."
          rm -rf .theos build-artifacts packages

      - name: Clone Theos Suite
        shell: bash
        run: |
          set -e
          HOST_NAME="github.com"
          THEOS_PATH="theos/theos.git"
          git clone --recursive --depth 1 "https://${HOST_NAME}/${THEOS_PATH}" ~/theos

      - name: Fast Download Isolated iOS 16 SDK
        shell: bash
        run: |
          set -e
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          
          HOST_NAME="github.com"
          SDK_ZIP_PATH="theos/sdks/archive/master.zip"
          
          curl -LO "https://${HOST_NAME}/${SDK_ZIP_PATH}"
          unzip -o -q master.zip
          
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf master.zip sdks-master
          echo "Isolated iOS 16.5 SDK ready in 5 seconds."

      - name: Install Signature Tools (ldid)
        shell: bash
        run: |
          set -e
          brew untap aws/tap >/dev/null 2>&1 || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid

      - name: Compile and Package via Theos Engine (Zero-Failure)
        shell: bash
        run: |
          set -euo pipefail
          
          # إعداد متغيرات بيئة النظام لـ Theos بشكل إجباري ومطلق
          export THEOS=~/theos
          export THEOS_DEVICE_IP=""
          
          # فرض الهدف والمعماريات المطلوبة بشكل صريح ونظيف لجهاز iPhone XR
          export TARGET=iphone:clang:16.5:15.0
          export ARCHS="arm64 arm64e"
          
          # تنظيف البناء القديم تماماً بداخل البيئة المحددة
          make clean THEOS=~/theos TARGET=iphone:clang:16.5:15.0 ARCHS="arm64 arm64e"
          
          # أمر التجميع النهائي الصارم باستخدام محرك Theos لربط ملفات الـ Category وحل مشاكل الـ Linker تلقائياً
          make FINALPACKAGE=1 THEOS=~/theos TARGET=iphone:clang:16.5:15.0 ARCHS="arm64 arm64e"

          echo "=== Verifying Built Binary Structure ==="
          find .theos -type f -name '*.dylib' -exec file {} \;

      - name: Safely Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-artifacts
          mkdir -p build-artifacts
          
          # تجميع مخرجات الـ dylib التي ينتجها نظام Theos بأسمائها الأصلية
          find .theos -type f -name '*.dylib' -exec cp -f {} build-artifacts/ \;
          
          if [ -d packages ]; then
            find packages -type f -name '*.deb' -exec cp -f {} build-artifacts/ \;
          fi

          echo "Artifacts ready:"
          ls -lah build-artifacts

      - name: Upload Verified Release Products
        uses: actions/upload-artifact@v6
        with:
          name: XsGpS-build
          path: build-artifacts/
          if-no-files-found: error
