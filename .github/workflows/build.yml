name: Build iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare Clean Root Environment
        shell: bash
        run: |
          set -e
          echo "Current directory files:"
          ls -lah
          
          if [ -f Makefile ]; then
            sed -i '' '/ARCHS/d' Makefile || true
            sed -i '' '/TARGET/d' Makefile || true
          fi

      - name: Clone Theos Suite
        shell: bash
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com ~/theos

      - name: Download iOS 16 SDK Package
        shell: bash
        run: |
          set -e
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          git init
          git remote add origin https://github.com
          git config core.sparseCheckout true
          echo "iPhoneOS16.5.sdk/*" > .git/info/sparse-checkout
          git pull --depth 1 origin master

      - name: Install Signature Tools (ldid)
        shell: bash
        run: |
          set -e
          brew untap aws/tap >/dev/null 2>&1 || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid

      - name: Force iOS Compilation from Root
        shell: bash
        run: |
          set -euo pipefail
          export THEOS=~/theos
          
          export TARGET=iphone:clang:16.5:15.0
          export ARCHS="arm64 arm64e"
          
          make clean
          make FINALPACKAGE=1 ARCHS="arm64 arm64e" TARGET=iphone:clang:16.5:15.0

          echo "=== Verification of Built Binaries ==="
          find .theos -type f -name '*.dylib' -exec file {} \;

      - name: Safely Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-artifacts
          mkdir -p build-artifacts

          find .theos -type f -name '*.dylib' -exec cp -f {} build-artifacts/ \;
          
          if [ -d packages ]; then
            find packages -type f -name '*.deb' -exec cp -f {} build-artifacts/ \;
          fi

          echo "Artifacts ready for deployment:"
          ls -lah build-artifacts

      - name: Upload Verified Release Products
        uses: actions/upload-artifact@v6
        with:
          name: XsGpS-build
          path: build-artifacts/
          if-no-files-found: error
