name: Build iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Clean Environment
        shell: bash
        run: |
          set -e
          echo "Cleaning old builds..."
          rm -rf .theos build-artifacts packages

      - name: Clone Theos Suite
        shell: bash
        run: |
          set -e
          HOST_NAME="github.com"
          THEOS_PATH="theos/theos.git"
          git clone --recursive --depth 1 "https://${HOST_NAME}/${THEOS_PATH}" ~/theos

      - name: Fast Download Isolated iOS 16 SDK
        shell: bash
        run: |
          set -e
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          
          HOST_NAME="github.com"
          SDK_ZIP_PATH="theos/sdks/archive/master.zip"
          
          curl -LO "https://${HOST_NAME}/${SDK_ZIP_PATH}"
          unzip -o -q master.zip
          
          mv sdks-master/iPhoneOS16.5.sdk .
          rm -rf master.zip sdks-master
          echo "Isolated iOS 16.5 SDK ready in 5 seconds."

      - name: Install Signature Tools (ldid)
        shell: bash
        run: |
          set -e
          brew untap aws/tap >/dev/null 2>&1 || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ldid

      - name: Force Compiling with Direct Clang (Zero-Failure)
        shell: bash
        run: |
          set -euo pipefail
          
          SDK_PATH="$HOME/theos/sdks/iPhoneOS16.5.sdk"
          CLANG_BIN="$(xcrun --sdk iphoneos --find clang)"
          
          SOURCE_FILES=$(find . -maxdepth 1 -name "*.m")
          
          echo "Compiling via Direct iOS Clang compiler with ARC enabled..."
          
          # إضافة -fobjc-arc لتمكين إدارة الذاكرة التلقائية وحل أخطاء الـ __weak تماماً
          $CLANG_BIN -dynamiclib -isysroot "$SDK_PATH" \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=15.0 \
            -fobjc-arc -fblocks \
            -O3 \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework CoreLocation -framework MapKit \
            $SOURCE_FILES \
            -o XsGpS.dylib

          echo "=== Verifying the generated Mach-O type ==="
          file XsGpS.dylib

          ldid -S XsGpS.dylib

      - name: Safely Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-artifacts
          mkdir -p build-artifacts
          
          if [ -f XsGpS.dylib ]; then
            cp -f XsGpS.dylib build-artifacts/
          else
            echo "ERROR: Target binary XsGpS.dylib was not compiled!"
            exit 1
          fi

          echo "Artifacts ready:"
          ls -lah build-artifacts

      - name: Upload Verified Release Products
        uses: actions/upload-artifact@v6
        with:
          name: XsGpS-build
          path: build-artifacts/
          if-no-files-found: error
